<!-- Apple Device Selector (iPhone / iPad) -->
<div class="vt" id="dt">
  <span class="vt-pill"></span>
  <button data-d="iphone" class="on" title="iPhone">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><line x1="10.5" y1="5" x2="13.5" y2="5"></line><line x1="10" y1="19" x2="14" y2="19"></line></svg></span>
    <span>iPhone</span>
  </button>
  <button data-d="ipad" title="iPad">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect><circle cx="12" cy="5" r="0.8" fill="currentColor"></circle><line x1="10" y1="19" x2="14" y2="19"></line></svg></span>
    <span>iPad</span>
  </button>
</div>
