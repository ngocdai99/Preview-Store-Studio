<!-- View Switcher (Detail View / Search Result) -->
<div class="vt" id="vt">
  <span class="vt-pill"></span>
  <button data-v="detail" class="on">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><rect x="7" y="7" width="4" height="4" rx="1"></rect><line x1="14" y1="7.5" x2="17" y2="7.5"></line><line x1="14" y1="10.5" x2="16" y2="10.5"></line><line x1="7" y1="15" x2="17" y2="15"></line><line x1="7" y1="18" x2="13" y2="18"></line></svg></span>
    <span>Detail View</span>
  </button>
  <button data-v="search">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21"></line></svg></span>
    <span>Search Result</span>
  </button>
</div>

<!-- Dual Phone Comparison Toggle Button -->
<div class="vt dual-phone-wrap" id="dualPhoneWrap">
  <button type="button" class="dual-phone-btn" id="btnDualPhone" title="Compare iPhone & Android Phone side-by-side on canvas">
    <span class="vt-ico">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="8" height="16" rx="2"></rect>
        <rect x="14" y="4" width="8" height="16" rx="2"></rect>
      </svg>
    </span>
    <span>Dual Phone</span>
  </button>
</div>
