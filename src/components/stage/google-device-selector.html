<!-- Google Play Device Selector (Phone / 7" / 10" Tablet) -->
<div class="vt" id="gdt">
  <span class="vt-pill"></span>
  <button data-gd="phone" class="on" title="Android phone">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><circle cx="12" cy="5" r="0.8" fill="currentColor"></circle><line x1="10" y1="19" x2="14" y2="19"></line></svg></span>
    <span>Phone</span>
  </button>
  <button data-gd="tab7" title="7-inch tablet">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect><line x1="10" y1="19" x2="14" y2="19"></line></svg></span>
    <span>7" Tablet</span>
  </button>
  <button data-gd="tab10" title="10-inch tablet">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"></rect><line x1="10" y1="17" x2="14" y2="17"></line></svg></span>
    <span>10" Tablet</span>
  </button>
  <button data-gd="dual" title="Dual Store Phone Preview (iPhone + Android)">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg></span>
    <span>Dual View</span>
  </button>
</div>
