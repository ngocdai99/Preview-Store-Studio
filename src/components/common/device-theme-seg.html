<!-- Shared Component: Device Theme Segment Switch (Icons with Sliding Pill) -->
<div class="vt theme-seg" id="theme" role="group" aria-label="Device Theme" title="Device Theme (Light / Dark)">
  <span class="vt-pill"></span>
  <button type="button" class="theme-seg-btn on" id="themeLight" data-theme="light" title="Light device theme">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
  </button>
  <button type="button" class="theme-seg-btn" id="themeDark" data-theme="dark" title="Dark device theme">
    <span class="vt-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
  </button>
</div>
