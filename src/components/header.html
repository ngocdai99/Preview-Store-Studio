<header>
  <div class="brand">
    <button class="sidebar-toggle-btn active" id="btnToggleSidebar" title="Toggle form panel (Sidebar) [Ctrl+B / ⌘B]" aria-label="Toggle Sidebar" aria-expanded="true">
      <svg class="ico-sidebar-expanded" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M9 3v18"></path>
        <path d="M3 6a3 3 0 0 1 3-3h3v18H6a3 3 0 0 1-3-3V6z" fill="currentColor"></path>
      </svg>
      <svg class="ico-sidebar-collapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M9 3v18"></path>
      </svg>
    </button>
    <div class="logo" id="logo" title="Store Preview Studio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7.5" y="2.5" width="13" height="14" rx="2" stroke="#fff" fill="rgba(255,255,255,0.2)"/><circle cx="14" cy="4.2" r="0.5" fill="#fff"/><rect x="3.5" y="6.5" width="9.5" height="15" rx="2.2" stroke="#fff" fill="rgba(255,255,255,0.28)"/><rect x="6.5" y="8" width="3.5" height="1" rx="0.5" fill="#fff"/><rect x="5.2" y="10.5" width="6" height="5.5" rx="0.8" fill="#fff" opacity="0.4"/><rect x="5.2" y="17.5" width="6" height="2.5" rx="0.6" fill="#fff" opacity="0.7"/></svg></div>
    <div>
      <h1>Store Preview Studio</h1>
      <p><span class="save-dot"></span> Live Store Optimizer & Preview</p>
    </div>
  </div>

  <div class="seg">
    <div class="pill"></div>
    <button data-s="apple" class="on"><span class="s-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm10 0a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V4zM4 14a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4zm10 0a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4z"/></svg></span><span>App Store</span></button>
    <button data-s="google"><span class="s-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.2c0-.9 1-1.5 1.8-1l12.4 7.8c.8.5.8 1.6 0 2.1L8.8 20.8c-.8.5-1.8-.1-1.8-1V4.2z"/></svg></span><span>Google Play</span></button>
  </div>

  <div class="right">
    <!-- Presets Dropdown -->
    <div class="dropdown">
      <button class="btn" id="btnPresets" title="Choose Template Preset"><span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></span><span class="lbl">Presets</span> <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span></button>
      <div class="menu" id="menuPresets">
        <button class="menu-item" data-preset="none">
          <span class="preset-thumb-blank" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </span>
          <span class="mi-t">
            <span class="mi-name">None (Blank)</span>
            <small>Clear all fields &amp; start fresh</small>
          </span>
        </button>
        <div class="menu-div"></div>
        <button class="menu-item" data-preset="taskflow">
          <img class="preset-thumb" alt="" aria-hidden="true">
          <span class="mi-t">
            <span class="mi-name">TaskFlow</span>
            <small>SaaS Productivity</small>
          </span>
        </button>
        <button class="menu-item" data-preset="pulsefit">
          <img class="preset-thumb" alt="" aria-hidden="true">
          <span class="mi-t">
            <span class="mi-name">PulseFit</span>
            <small>Fitness &amp; Workout</small>
          </span>
        </button>
        <button class="menu-item" data-preset="zenmind">
          <img class="preset-thumb" alt="" aria-hidden="true">
          <span class="mi-t">
            <span class="mi-name">ZenMind</span>
            <small>Meditation &amp; Sleep</small>
          </span>
        </button>
        <button class="menu-item" data-preset="cyberstrike">
          <img class="preset-thumb" alt="" aria-hidden="true">
          <span class="mi-t">
            <span class="mi-name">CyberStrike</span>
            <small>Sci-Fi Cyber RPG Game</small>
          </span>
        </button>
        <button class="menu-item" data-preset="edulearn">
          <img class="preset-thumb" alt="" aria-hidden="true">
          <span class="mi-t">
            <span class="mi-name">SkillSphere</span>
            <small>Online Video Courses</small>
          </span>
        </button>
      </div>
    </div>

    <!-- Page Theme Toggle -->
    <!-- @include "components/common/page-theme-btn.html" -->

    <!-- Export Menu -->
    <div class="dropdown">
      <button class="btn primary" id="btnExport" title="Export Deliverables"><span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span><span class="lbl">Export</span> <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span></button>
      <div class="menu" id="menuExport">
        <div class="menu-label">
          <span class="dot dot-blue"></span>Images &amp; Screenshots
        </div>
        <button class="menu-item" id="optExportPNG3x"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Save as image</span><small>Device frame + store page · 3x</small></span><span class="mi-pill mi-pill-blue">3x PNG</span></button>
        <button class="menu-item" id="optExportScreen"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Save as image (No phone frame)</span><small>Store page UI without device bezel · 3x</small></span><span class="mi-pill mi-pill-blue">3x PNG</span></button>
        <button class="menu-item" id="optExportIpadShots" data-only="apple"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export iPad Screenshots</span><small>All 2048×2732 px PNGs in single .zip package</small></span><span class="mi-pill mi-pill-green">ZIP</span></button>
        <button class="menu-item" id="optExportPhoneShots"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Phone Screenshots</span><small>All phone screenshots in single .zip package</small></span><span class="mi-pill mi-pill-green">ZIP</span></button>
        <button class="menu-item" id="optExportTab7Shots" data-only="google"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export 7" Tablet Screenshots</span><small>All 7-inch tablet screenshots in single .zip package</small></span><span class="mi-pill mi-pill-green">ZIP</span></button>
        <button class="menu-item" id="optExportTab10Shots" data-only="google"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export 10" Tablet Screenshots</span><small>All 10-inch tablet screenshots in single .zip package</small></span><span class="mi-pill mi-pill-green">ZIP</span></button>
        <button class="menu-item" id="optExportAllTablets" data-only="google"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export All Tablets</span><small>All 7" and 10" tablet screenshots combined</small></span><span class="mi-pill mi-pill-green">ZIP</span></button>
        <button class="menu-item" id="optExportGooglePlayBundle" data-only="google"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export All Assets (Google Play)</span><small>Phone + Tablets + Feature Graphic + App Icon bundle</small></span><span class="mi-pill mi-pill-emerald">Bundle</span></button>
        
        <div class="menu-div"></div>
        <div class="menu-label">
          <span class="dot dot-purple"></span>Store Metadata
        </div>
        <button class="menu-item" id="btnCopyText"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Copy Metadata to Clipboard</span><small>App name, subtitle, descriptions,...</small></span><span class="mi-pill mi-pill-accent">Copy</span></button>
        <button class="menu-item" id="optExportMD"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Metadata (LISTING_METADATA.md)</span><small>Complete store listing document</small></span><span class="mi-pill mi-pill-code">MD</span></button>
        <button class="menu-item" id="optExportJSON"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Project</span><small>Save full backup of text, images &amp; settings</small></span><span class="mi-pill mi-pill-code">JSON</span></button>
        
        <div class="menu-div"></div>
        <div class="menu-label">
          <span class="dot dot-emerald"></span>Import &amp; Reset
        </div>
        <button class="menu-item" id="optImportJSON"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Import Project</span><small>Open project from .json file</small></span><span class="mi-pill mi-pill-code">JSON</span></button>
        <button class="menu-item" id="optResetDefault"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Reset</span><small>Clear local draft and reload</small></span><span class="mi-pill mi-pill-danger">Reset</span></button>
      </div>
    </div>
    <input type="file" id="jsonFileInput" accept=".json" hidden>
  </div>
</header>
