<!-- Card 4: Settings & Metrics -->
<div class="card" id="statsCard">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
    <h2 style="margin:0"><span class="card-num" title="Card 4">4</span><i class="card-ico c-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></i>Settings &amp; Metrics</h2>
    <span class="info-tip-btn" id="metricsInfoBtn" tabindex="0" role="button" aria-label="Mockup Metrics Display Guidelines" title="How Metrics &amp; Badges Work in Preview Studio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin:2px 0 6px;flex-wrap:wrap">
    <span class="tag a" title="App Store">APPLE</span>
    <span class="tag g" title="Google Play">GOOGLE</span>
    <span class="tag" style="background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.25);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:0.04em">MOCKUP ONLY</span>
  </div>
  <p class="hint">Ratings, ranking, and download badges use illustrative sample data.</p>

  <details class="metrics-details" id="metricsDetails">
    <summary class="metrics-summary">
      <div class="metrics-btn-left">
        <span class="metrics-btn-ico">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </span>
        <span class="metrics-btn-title">Customize</span>
      </div>
      <div class="metrics-btn-action">
        <svg class="ms-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </summary>
    <div class="metrics-content">
      <div class="stat-grid">
        <div class="fg"><div class="lr"><label for="f-st-rating">Rating</label></div><input type="text" id="f-st-rating" maxlength="4" placeholder="4.9"></div>
        <div class="fg"><div class="lr"><label for="f-st-count">Ratings Count</label></div><input type="text" id="f-st-count" maxlength="8" placeholder="1.8K"></div>
        <div class="fg"><div class="lr"><label for="f-st-rank">Chart Rank (#)</label></div><input type="text" id="f-st-rank" maxlength="4" placeholder="1"></div>
        <div class="fg"><div class="lr"><label for="f-st-dl">Downloads (Google)</label></div><input type="text" id="f-st-dl" maxlength="10" placeholder="50K+"></div>
        <div class="fg"><div class="lr"><label for="f-st-size">App Size</label></div><input type="text" id="f-st-size" maxlength="10" placeholder="86 MB"></div>
        <div class="fg">
          <div class="lr"><label for="f-st-age">Age Rating</label></div>
          <select class="fsel" id="f-st-age" aria-label="Age Rating">
            <option value="4+">4+ / Everyone (E)</option>
            <option value="9+">9+ / Everyone 10+ (E10+)</option>
            <option value="12+">12+ / Teen (T)</option>
            <option value="17+">17+ / Mature 17+ (M)</option>
          </select>
        </div>
        <div class="fg" style="grid-column:1 / -1">
          <div class="lr"><label for="f-st-iap">Monetization Badge</label></div>
          <select class="fsel" id="f-st-iap" aria-label="Monetization Badge">
            <option value="iap">In-App Purchases (No Ads)</option>
            <option value="ads_iap">Contains Ads · In-App Purchases</option>
            <option value="ads">Contains Ads Only</option>
            <option value="free">None (100% Free / Paid Upfront)</option>
          </select>
        </div>
      </div>
    </div>
  </details>

  <!-- Hidden state inputs to maintain 100% backward compatibility for export & presets -->
  <input type="hidden" id="f-st-off" value="false">
  <input type="hidden" id="f-st-wm" value="false">
</div>
