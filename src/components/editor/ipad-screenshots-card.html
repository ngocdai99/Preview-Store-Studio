<!-- Card 5B: iPad Screenshots Gallery (Apple Universal) -->
<div class="card" data-only="apple" id="ipadCard" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2><i class="card-ico c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect><circle cx="12" cy="5" r="0.8" fill="currentColor"></circle><line x1="10" y1="19" x2="14" y2="19"></line></svg></i>iPad Screenshots (13" Pro)</h2>
    <span class="cc" id="ipadShotCounter">0 / 10 screenshots</span>
  </div>
  <div id="ipadShotStatusBadge" class="shot-status-badge ok"></div>
  <p class="hint">
    <strong>Apple Universal Rule:</strong> Upload at least 1 (up to 10) screenshot for <strong>iPad Pro 13-inch (2048×2732 px, 4:3)</strong>. Apple automatically downscales this set for all smaller iPads. If empty, mockup displays scaled iPhone screenshots. Drag ⠿ handle to reorder.
  </p>
  <div class="fg" style="margin-bottom:8px">
    <div class="lr"><label>Resize Fit Mode<span class="tag a">IPAD PRO</span></label></div>
    <select class="fsel" id="f-ipad-fit-mode" aria-label="iPad Resize Fit Mode">
      <option value="cover" selected>Fill / Cover (Recommended) — Full bleed 2048×2732 px (Zero borders)</option>
      <option value="contain">Fit / Contain — Preserves 100% content + Soft blurred backdrop</option>
    </select>
  </div>
  <div class="sl" id="ipadSlist"></div>
  <div style="display:flex;gap:6px">
    <button class="add" id="addIpadShot" style="flex:1"><span class="add-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>Add Screenshot</button>
    <button class="add" id="btnGenIpadFromPhone" title="Auto-generate 2048×2732 px iPad screenshots from phone screenshots" style="flex:1"><span class="add-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.4 5.4 5.6 2.1-5.6 2.1-2.4 5.4-2.4-5.4-5.6-2.1 5.6-2.1 2.4-5.4zm7.5 12.5l1.2 2.7 2.8 1-2.8 1-1.2 2.8-1.2-2.8-2.8-1 2.8-1 1.2-2.7z"></path></svg></span>From Phone Shots</button>
  </div>
  <input type="file" id="ipadShotFile" accept="image/*" hidden>
</div>
