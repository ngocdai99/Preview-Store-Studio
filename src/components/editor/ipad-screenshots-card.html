<!-- Card 5: iPad Screenshots Gallery (Apple Universal) -->
<div class="card collapsed" data-only="apple" id="ipadCard" style="display:none">
  <div class="card-header">
    <h2><span class="card-num" title="Card 5">5</span><i class="card-ico c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect><circle cx="12" cy="5" r="0.8" fill="currentColor"></circle><line x1="10" y1="19" x2="14" y2="19"></line></svg></i>iPad Screenshots</h2>
    <div class="card-header-right">
      <span class="cc" id="ipadShotCounter">0 / 10 screenshots</span>
      <span class="card-toggle-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
  </div>
  <div id="ipadShotStatusBadge" class="shot-status-badge" style="display:none"></div>
  <p class="hint">
    <strong>iPad Pro 13" (4:3 ratio):</strong> Upload 1–10 screenshots at <strong>2048×2732 px</strong> or <strong>2064×2752 px</strong>. If empty, mockup displays scaled iPhone screenshots. Drag ⠿ handle to reorder.
  </p>
  <div class="sl" id="ipadSlist"></div>
  <button class="add" id="addIpadShot"><span class="add-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>Add Screenshot</button>
  <input type="file" id="ipadShotFile" accept="image/*" hidden>
</div>
