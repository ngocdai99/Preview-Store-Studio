<!-- Card 7: Feature Graphic (Google Play only, 1024×500 px) -->
<div class="card" data-only="google" id="featureCard">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2><span class="card-num" title="Card 7">7</span><i class="card-ico c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></i>Feature Graphic (1024×500 px)</h2>
    <div style="display:inline-flex;align-items:center;gap:6px">
      <span class="tag g">GOOGLE</span>
      <span class="info-tip-btn" id="featureInfoBtn" tabindex="0" role="button" aria-label="Feature Graphic Information">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
    </div>
  </div>
  <p class="hint">Required asset for Google Play Console submission. Used for store featuring, promo video cover, and Google Ads.</p>
  <div id="featureStatusBadge" class="shot-status-badge" style="display:none;margin:4px 0 2px"></div>
  <div class="feature-wrap" id="featureDropZone" title="Click or Drag & Drop 1024×500 image">
    <img id="featurePrev" data-feature alt="Feature Graphic" style="cursor:pointer">
    <button type="button" class="feature-remove-btn" id="featureRemove" title="Remove Feature Graphic" aria-label="Remove Feature Graphic" style="display:none">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="feature-drop-overlay">Drop 1024×500 image</div>
  </div>
  <div style="display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap">
    <button type="button" class="mini shot-upload-btn" id="featureUp" title="Upload / Replace Feature Graphic" aria-label="Upload / Replace Feature Graphic"><span class="btn-mini-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></span></button>
    <button type="button" class="mini shot-inspect-btn" id="featureInspect" title="Inspect Feature Graphic Details &amp; Compliance" aria-label="Inspect Feature Graphic Details &amp; Compliance"><span class="btn-mini-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span></button>
    <span class="shot-dim-tag" id="featureDimTag" style="display:none;margin-left:auto"></span>
    <input type="file" id="featureFile" accept="image/*" hidden>
  </div>
  <p class="hint" style="font-size:10.5px">Standard ratio: 1024×500 px (~2.05:1). PNG or JPEG up to 15 MB, no alpha.</p>
</div>
