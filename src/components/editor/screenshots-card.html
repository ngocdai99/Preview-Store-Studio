<!-- Card 5: Phone Screenshots Gallery -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2><i class="card-ico c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="17" rx="2.5"></rect><path d="M9 2h9a2 2 0 0 1 2 2v13"></path><circle cx="8" cy="9.5" r="1.2" fill="currentColor" stroke="none"></circle><path d="M4 17l3.5-3.5 2.5 2.5 3-3.5 3 4.5"></path></svg></i>Phone Screenshots</h2>
    <span class="cc" id="shotCounter">4 / 8 screenshots</span>
  </div>
  <div id="shotStatusBadge" class="shot-status-badge ok"><span class="sb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></span><span><strong>App Store Ready:</strong> 4 screenshots (Valid range: 2–10)</span></div>
  <p class="hint">
    <strong>Console Rules:</strong> Upload 2–8 screenshots. PNG or JPEG, up to 8 MB each, 16:9 or 9:16 aspect ratio, each side between 320 px and 3,840 px. Drag ⠿ handle to reorder.
  </p>
  <div class="sl" id="slist"></div>
  <button class="add" id="addShot"><span class="add-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>Add Screenshot</button>
  <input type="file" id="shotFile" accept="image/*" hidden>
</div>
