<!-- Card Privacy: App Privacy & Data Safety -->
<div class="card collapsed" id="privacyCard">
  <div class="card-header">
    <h2><span class="card-num" title="App Privacy &amp; Data Safety"><span data-only="apple">6</span><span data-only="google">7</span></span><i class="card-ico c-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></i>App Privacy &amp; Data Safety</h2>
    <div class="card-header-right">
      <span class="info-tip-btn" id="privacyInfoBtn" tabindex="0" role="button" aria-label="Privacy &amp; Data Safety Guidelines" title="Console Questionnaire Guidelines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
      <span class="card-toggle-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
  </div>
  
  <div class="privacy-compact-box" id="privacyMockBanner" role="button" tabindex="0" title="Click to view Privacy section on device">
    <div class="pcb-left">
      <div class="pcb-meta">
        <div class="pcb-title">
          <span id="privacyStatusLabel">Store Compliance Profile</span>
        </div>
        <div class="pcb-tags">
          <span class="tag a" title="App Store Nutrition Labels">APPLE</span>
          <span class="tag g" title="Google Play Data Safety">GOOGLE</span>
        </div>
        <div class="pcb-sub">Standard store disclosures included automatically for your draft &amp; presets</div>
      </div>
    </div>
    <span class="pcb-action">Inspect &rarr;</span>
  </div>

  <!-- Hidden state inputs to maintain 100% backward compatibility for export & presets -->
  <input type="hidden" id="f-priv-linked" value="User Content (Tasks &amp; Habits), Identifiers, Usage Data">
  <input type="hidden" id="f-priv-notlinked" value="Diagnostics, Performance Data">
  <input type="hidden" id="f-priv-google" value="No data shared with third parties, Data is encrypted in transit, You can request data deletion">
</div>
