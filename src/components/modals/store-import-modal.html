<!-- Universal Store Import Modal (App Store & Google Play) -->
<div class="confirm-modal-backdrop" id="storeImportModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-modal-card store-import-card">
    <div class="confirm-modal-header">
      <div class="confirm-modal-icon-wrap store-import-icon-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <div class="confirm-modal-meta">
        <h4 class="confirm-modal-title">Import App from Store</h4>
        <p class="confirm-modal-desc">Paste an App Store or Google Play link, Apple App ID, or Android package name to instantly fetch real metadata, icons, and screenshots.</p>
      </div>
    </div>

    <div class="store-import-body">
      <div class="store-import-input-wrap">
        <input type="text" id="storeImportInput" class="store-import-input" placeholder="e.g. https://apps.apple.com/... or com.spotify.music or 324684580" autocomplete="off" spellcheck="false">
      </div>

      <div class="store-import-chips">
        <span class="store-import-chips-label">Quick test:</span>
        <button type="button" class="store-import-chip" data-import-val="324684580">Spotify (iOS)</button>
        <button type="button" class="store-import-chip" data-import-val="com.spotify.music">Spotify (Android)</button>
        <button type="button" class="store-import-chip" data-import-val="570060128">Duolingo</button>
        <button type="button" class="store-import-chip" data-import-val="org.telegram.messenger">Telegram</button>
      </div>

      <div id="storeImportStatus" class="store-import-status" style="display:none;"></div>
    </div>

    <div class="confirm-modal-actions">
      <button type="button" class="confirm-btn-cancel" id="storeImportCancel">Cancel</button>
      <button type="button" class="confirm-btn-reset store-import-btn-submit" id="storeImportSubmit">Import App</button>
    </div>
  </div>
</div>
