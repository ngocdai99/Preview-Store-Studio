<!-- Modern Export Mockup Image Modal (Visual Preview Studio) -->
<div class="confirm-modal-backdrop" id="exportImageModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-modal-card export-modal-card">
    <div class="export-modal-header">
      <div class="export-modal-brand">
        <div class="export-modal-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div>
          <h4 class="export-modal-title">Export Mockup Image</h4>
          <p class="export-modal-subtitle">Transparent PNG for Figma, Canva &amp; banners</p>
        </div>
      </div>
      <button type="button" class="export-modal-close" id="exportModalClose" aria-label="Close modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>


    <div class="export-modal-body">
      <!-- 1. Framing Choice -->
      <div class="export-field">
        <span class="export-field-label">Framing</span>
        <div class="export-radio-group" role="radiogroup" aria-label="Framing">
          <label class="export-radio-item active" data-opt="frame" data-val="device">
            <input type="radio" name="exportFrame" value="device" class="export-radio-input" checked>
            <span class="export-radio-indicator"></span>
            <span class="export-radio-label">Device Frame</span>
          </label>
          <label class="export-radio-item" data-opt="frame" data-val="screen">
            <input type="radio" name="exportFrame" value="screen" class="export-radio-input">
            <span class="export-radio-indicator"></span>
            <span class="export-radio-label">Screen Only</span>
          </label>
        </div>
      </div>

      <!-- 2. Scale / Resolution Choice -->
      <div class="export-field">
        <span class="export-field-label">Resolution</span>
        <div class="export-radio-group" role="radiogroup" aria-label="Resolution">
          <label class="export-radio-item" data-opt="scale" data-val="2">
            <input type="radio" name="exportScale" value="2" class="export-radio-input">
            <span class="export-radio-indicator"></span>
            <span class="export-radio-label">2x HD</span>
          </label>
          <label class="export-radio-item active" data-opt="scale" data-val="3">
            <input type="radio" name="exportScale" value="3" class="export-radio-input" checked>
            <span class="export-radio-indicator"></span>
            <span class="export-radio-label">
              <span>3x Ultra HD</span>
              <span class="export-tag-best">Retina</span>
            </span>
          </label>
        </div>
      </div>
    </div>

    <div class="export-modal-footer">
      <div class="export-footer-actions">
        <button type="button" class="export-btn-secondary" id="exportModalCopy" title="Copy high-res image directly to clipboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy Image</span>
        </button>
        <button type="button" class="export-btn-primary" id="exportModalDownload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download PNG</span>
        </button>
      </div>
    </div>
  </div>
</div>
