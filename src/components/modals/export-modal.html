<!-- Export Mockup Image Options Modal -->
<div class="confirm-modal-backdrop" id="exportImageModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-modal-card export-modal-card">
    <div class="confirm-modal-header">
      <div class="confirm-modal-icon-wrap export-modal-icon-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <div class="confirm-modal-meta">
        <div class="export-modal-title-row">
          <h4 class="confirm-modal-title">Export Mockup Image</h4>
          <span class="export-modal-badge">PNG</span>
        </div>
        <p class="confirm-modal-desc">Configure framing, background transparency, and resolution for presentation or design.</p>
      </div>
      <button type="button" class="export-modal-close" id="exportModalClose" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="export-modal-body">
      <!-- 1. Framing Option -->
      <div class="export-opt-group">
        <label class="export-opt-label">Framing &amp; Bezel</label>
        <div class="export-opt-segmented" role="radiogroup" aria-label="Framing">
          <button type="button" class="export-seg-btn active" data-opt="frame" data-val="device">
            <span class="export-seg-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="3"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
              </svg>
            </span>
            <span class="export-seg-text">
              <span class="export-seg-title">Device Frame</span>
              <small class="export-seg-sub">Realistic phone with hardware buttons</small>
            </span>
          </button>
          <button type="button" class="export-seg-btn" data-opt="frame" data-val="screen">
            <span class="export-seg-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </span>
            <span class="export-seg-text">
              <span class="export-seg-title">Screen Only</span>
              <small class="export-seg-sub">Store page UI without device bezel</small>
            </span>
          </button>
        </div>
      </div>

      <!-- 2. Background Transparency Option -->
      <div class="export-opt-group" id="exportBgGroup">
        <label class="export-opt-label">Background Style</label>
        <div class="export-opt-segmented" role="radiogroup" aria-label="Background Style">
          <button type="button" class="export-seg-btn active" data-opt="bg" data-val="transparent">
            <span class="export-seg-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"></rect>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
            <span class="export-seg-text">
              <span class="export-seg-title">Transparent Cutout</span>
              <small class="export-seg-sub">100% alpha · Ideal for Figma &amp; Banners</small>
            </span>
          </button>
          <button type="button" class="export-seg-btn" data-opt="bg" data-val="shadow">
            <span class="export-seg-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <path d="M7 17l10-10"></path>
              </svg>
            </span>
            <span class="export-seg-text">
              <span class="export-seg-title">With Soft Shadow</span>
              <small class="export-seg-sub">Realistic stage shadow · For slides</small>
            </span>
          </button>
        </div>
      </div>

      <!-- 3. Resolution Option -->
      <div class="export-opt-group">
        <label class="export-opt-label">Resolution Scale</label>
        <div class="export-scale-grid" role="radiogroup" aria-label="Resolution">
          <button type="button" class="export-scale-btn" data-opt="scale" data-val="2">
            <span class="export-scale-val">2x</span>
            <span class="export-scale-sub">Standard HD</span>
          </button>
          <button type="button" class="export-scale-btn active" data-opt="scale" data-val="3">
            <span class="export-scale-val">3x</span>
            <span class="export-scale-sub">Ultra HD (Retina)</span>
            <span class="export-scale-tag">Recommended</span>
          </button>
        </div>
      </div>
    </div>

    <div class="confirm-modal-actions export-modal-actions">
      <button type="button" class="confirm-btn-cancel" id="exportModalCancel">Cancel</button>
      <button type="button" class="export-btn-copy" id="exportModalCopy" title="Copy high-res image directly to clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Copy Image</span>
      </button>
      <button type="button" class="confirm-btn-reset export-btn-download" id="exportModalDownload">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download PNG</span>
      </button>
    </div>
  </div>
</div>
