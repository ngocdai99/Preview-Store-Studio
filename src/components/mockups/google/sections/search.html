<!-- Google Play Search Result View (Modern Material You Style) -->
<div data-v="search" class="gp-search-view" style="display:none">
  <!-- Top Search Bar Header -->
  <div class="gp-search-bar">
    <button type="button" class="gp-search-back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="gp-search-input-box">
      <span class="gp-search-query-text" data-b="name">App Name</span>
    </div>
    <div class="gp-search-bar-actions">
      <button type="button" class="gp-search-act-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button type="button" class="gp-search-act-btn" aria-label="Voice Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Horizontal Filter Chips Carousel -->
  <div class="gp-search-chips-wrap">
    <div class="gp-search-chip gp-chip-dropdown">
      <span>Rating</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="gp-search-chip"><span>Family</span></div>
    <div class="gp-search-chip"><span>New</span></div>
    <div class="gp-search-chip"><span>Widgets</span></div>
    <div class="gp-search-chip"><span>Top charts</span></div>
  </div>

  <!-- Primary Target App Card (User's Previewed App) -->
  <div class="gp-search-card primary">
    <div class="gp-search-card-main">
      <img data-icon alt="App Icon" class="gp-search-card-icon">
      <div class="gp-search-card-info">
        <div class="gp-search-card-name" data-b="name">App Name</div>
        <div class="gp-search-card-meta">
          <span data-b="dev">Developer Name</span> &bull; <span data-b="cat">Productivity</span>
        </div>
        <div class="gp-search-card-stats">
          <span class="gp-stat-rating">
            <span data-stat="rating">4.8</span>
            <svg class="gp-star-ico" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </span>
          <span class="gp-stat-size"><span data-stat="size">45 MB</span></span>
          <span class="gp-stat-dl">
            <svg class="gp-dl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-stat="dl">100K+</span>
          </span>
        </div>
      </div>
      <button type="button" class="gp-search-action-btn" title="View details" aria-label="Details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- 3 Screenshots Preview Carousel -->
    <div class="shots gp-search-shots" data-shots="shots"></div>
  </div>

  <!-- Organic Secondary Search Results (Realistic Authentic Scroll) -->
  <div class="gp-search-card secondary" aria-hidden="true">
    <div class="gp-search-card-main">
      <div class="gp-search-card-icon gp-dummy-icon gp-dummy-icon-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="gp-search-card-info">
        <div class="gp-search-card-name">AVN-LIVE Stream</div>
        <div class="gp-search-card-meta">AVN LIVE &bull; Social</div>
        <div class="gp-search-card-stats">
          <span class="gp-stat-rating">4.4 <svg class="gp-star-ico" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></span>
          <span class="gp-stat-size">12 MB</span>
          <span class="gp-stat-dl"><svg class="gp-dl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 1K+</span>
        </div>
      </div>
      <button type="button" class="gp-search-action-btn" aria-label="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>

  <div class="gp-search-card secondary" aria-hidden="true">
    <div class="gp-search-card-main">
      <div class="gp-search-card-icon gp-dummy-icon gp-dummy-icon-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <div class="gp-search-card-info">
        <div class="gp-search-card-name">AVN DPS Campus</div>
        <div class="gp-search-card-meta">AAAMT Verticals &bull; Education</div>
        <div class="gp-search-card-stats">
          <span class="gp-stat-size">30 MB</span>
          <span class="gp-stat-dl"><svg class="gp-dl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 10K+</span>
        </div>
      </div>
      <button type="button" class="gp-search-action-btn" aria-label="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>

  <div class="gp-search-card secondary" aria-hidden="true">
    <div class="gp-search-card-main">
      <div class="gp-search-card-icon gp-dummy-icon gp-dummy-icon-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
      </div>
      <div class="gp-search-card-info">
        <div class="gp-search-card-name">V-PMS Smart Tools</div>
        <div class="gp-search-card-meta">Vingroup Joint Stock &bull; Tools</div>
        <div class="gp-search-card-stats">
          <span class="gp-stat-rating">4.0 <svg class="gp-star-ico" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></span>
          <span class="gp-stat-size">71 MB</span>
          <span class="gp-stat-dl"><svg class="gp-dl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 10K+</span>
        </div>
      </div>
      <button type="button" class="gp-search-action-btn" aria-label="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>

  <!-- Sponsored Section Divider -->
  <div class="gp-search-sponsored-divider" aria-hidden="true">
    <div class="gp-sponsored-label">
      <span>Sponsored &bull; Suggested for you</span>
    </div>
    <button type="button" class="gp-sponsored-more-btn" aria-label="More options">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <circle cx="12" cy="5" r="1.8"/>
        <circle cx="12" cy="12" r="1.8"/>
        <circle cx="12" cy="19" r="1.8"/>
      </svg>
    </button>
  </div>
</div>
