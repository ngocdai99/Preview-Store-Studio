<!-- Apple iPad Preview Gallery & Platforms Support -->
<div class="ipad-shots-sec">
  <div class="gal ipad-gal" id="ipadGal" data-shots="ipad-gal"></div>

  <!-- Platforms Support Badge Line (iPad, iPhone dropdown) -->
  <div class="ipad-platforms-row">
    <span class="ipad-plat-icons">
      <svg class="ipad-plat-tablet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2.5"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <svg class="ipad-plat-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="3" width="12" height="18" rx="2.5"></rect>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </span>
    <span class="ipad-plat-label">iPad, iPhone</span>
    <svg class="ipad-plat-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>
</div>
