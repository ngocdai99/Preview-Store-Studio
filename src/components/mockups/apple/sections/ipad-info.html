<!-- Apple iPad Information Section (iOS 18 Authentic 2-Column Stacked) -->
<div class="sec ipad-info-sec">
  <h3 class="ipad-sec-title">Information</h3>
  <div class="ipad-info-grid">
    <!-- Row 1: Provider & Size -->
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Provider</div>
      <div class="ipad-info-val" data-b="dev">FlowCraft Studio Inc.</div>
    </div>
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Size</div>
      <div class="ipad-info-val" data-stat="size">86.4 MB</div>
    </div>

    <!-- Row 2: Category & Languages -->
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Category</div>
      <div class="ipad-info-val" data-b="cat">Productivity</div>
    </div>
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Languages</div>
      <div class="ipad-info-val">English, Vietnamese, French</div>
    </div>

    <!-- Row 3: Age Rating & Copyright -->
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Age Rating</div>
      <div class="ipad-info-val" data-age-apple>4+</div>
    </div>
    <div class="ipad-info-cell">
      <div class="ipad-info-label">Copyright</div>
      <div class="ipad-info-val">&copy; <span data-b="dev">FlowCraft Studio Inc.</span></div>
    </div>
  </div>

  <!-- Privacy Policy Row with Blue Hand Icon -->
  <div class="ipad-info-privacy-row">
    <span class="ipad-info-hand-ico">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 2a1.5 1.5 0 0 1 1.5 1.5v6a.5.5 0 0 0 1 0v-5a1.5 1.5 0 0 1 3 0v5a.5.5 0 0 0 1 0v-3a1.5 1.5 0 0 1 3 0v7.5c0 5-4 9-9 9s-9-4-9-9V11a1.5 1.5 0 0 1 3 0v3a.5.5 0 0 0 1 0v-7a1.5 1.5 0 0 1 3 0v4.5a.5.5 0 0 0 1 0v-8A1.5 1.5 0 0 1 12 2z"/>
      </svg>
    </span>
    <span class="ipad-info-priv-link">Privacy Policy</span>
  </div>
</div>
