<!-- Apple Search View (Modern iOS 18 Style) -->
<div data-v="search" class="apple-search-view" style="display:none">
  <!-- Reusable iPhone Search Header Component (Frosted Glass with Search Bar & Clear X) -->
  <!-- @include "components/mockups/apple/sections/search-header.html" -->

  <!-- Primary App Result Card -->
  <div class="sr-app-card">
    <div class="sr-header">
      <div class="sr-icon-wrap">
        <img data-icon alt="App Icon" class="sr-app-icon">
      </div>
      <div class="sr-info">
        <div class="sr-title" data-b="name">App Name</div>
        <div class="sr-subtitle" data-b="sub">App Subtitle</div>
        <div class="sr-stars-row">
          <span class="sr-stars">★★★★★</span>
          <span class="sr-rating-val" data-stat="rating">4.9</span>
          <span class="sr-rating-cnt">(<span class="sv" data-stat="count">1.8K</span>)</span>
        </div>
      </div>
      <button class="get sr-get-btn">GET</button>
    </div>

    <!-- Metadata Line: Category | Developer Name -->
    <div class="sr-meta-line">
      <span class="sr-category" data-b="cat">Health &amp; Fitness</span>
      <span class="sr-divider">|</span>
      <span class="sr-dev">
        <svg class="sr-dev-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="9" cy="10" r="2"></circle>
          <path d="M15 8h2"></path>
          <path d="M15 12h2"></path>
          <path d="M7 16h10"></path>
        </svg>
        <span data-b="dev">Developer Name</span>
      </span>
    </div>

    <!-- 3 Screenshots Gallery (Shows uploaded shots or fallback skeleton placeholders) -->
    <div class="shots sr-shots" data-shots="shots">
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
    </div>
  </div>

  <!-- Realistic Secondary Search Results (3 Skeleton Cards for Authentic Scrolling) -->
  <div class="sr-skeleton-card" aria-hidden="true">
    <div class="sr-header">
      <div class="sr-skel-icon"></div>
      <div class="sr-info">
        <div class="sr-skel-line w-45"></div>
        <div class="sr-skel-line w-75"></div>
        <div class="sr-skel-stars">★★★★★</div>
      </div>
      <div class="sr-skel-btn"></div>
    </div>
    <div class="sr-meta-line">
      <div class="sr-skel-line w-25"></div>
      <span class="sr-divider">|</span>
      <div class="sr-skel-line w-35"></div>
    </div>
    <div class="sr-skel-shots">
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
    </div>
  </div>

  <div class="sr-skeleton-card" aria-hidden="true">
    <div class="sr-header">
      <div class="sr-skel-icon"></div>
      <div class="sr-info">
        <div class="sr-skel-line w-55"></div>
        <div class="sr-skel-line w-60"></div>
        <div class="sr-skel-stars">★★★★★</div>
      </div>
      <div class="sr-skel-btn"></div>
    </div>
    <div class="sr-meta-line">
      <div class="sr-skel-line w-30"></div>
      <span class="sr-divider">|</span>
      <div class="sr-skel-line w-40"></div>
    </div>
    <div class="sr-skel-shots">
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
    </div>
  </div>

  <div class="sr-skeleton-card" aria-hidden="true">
    <div class="sr-header">
      <div class="sr-skel-icon"></div>
      <div class="sr-info">
        <div class="sr-skel-line w-35"></div>
        <div class="sr-skel-line w-80"></div>
        <div class="sr-skel-stars">★★★★★</div>
      </div>
      <div class="sr-skel-btn"></div>
    </div>
    <div class="sr-meta-line">
      <div class="sr-skel-line w-20"></div>
      <span class="sr-divider">|</span>
      <div class="sr-skel-line w-30"></div>
    </div>
    <div class="sr-skel-shots">
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
      <div class="sr-skel-shot"></div>
    </div>
  </div>
</div>
