<!-- Store Switcher Segmented Control -->
<div class="seg" role="tablist" aria-label="Store Platform">
  <div class="pill" aria-hidden="true"></div>
  <button data-s="dual" role="tab" aria-selected="false" aria-label="Dual Store Phone Preview (iPhone &amp; Android Phone side-by-side)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <line x1="12" y1="3" x2="12" y2="21"></line>
      </svg>
    </span>
    <span>Dual View</span>
    <span class="seg-tooltip" role="tooltip">
      <span class="seg-tt-head">
        <span class="seg-tt-title">Dual Store Comparison</span>
        <span class="seg-tt-badge">Phone Only</span>
      </span>
      <span class="seg-tt-body">Side-by-side preview of <b>iPhone</b> and <b>Android Phone</b> on one canvas.</span>
    </span>
  </button>
  <button data-s="apple" class="on" role="tab" aria-selected="true" aria-label="Apple App Store Preview (iPhone &amp; iPad)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm10 0a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V4zM4 14a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4zm10 0a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4z"/>
      </svg>
    </span>
    <span>App Store</span>
  </button>
  <button data-s="google" role="tab" aria-selected="false" aria-label="Google Play Store Preview (Phone, 7&quot; Tablet, and 10&quot; Tablet)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 4.2c0-.9 1-1.5 1.8-1l12.4 7.8c.8.5.8 1.6 0 2.1L8.8 20.8c-.8.5-1.8-.1-1.8-1V4.2z"/>
      </svg>
    </span>
    <span>Google Play</span>
  </button>
</div>
