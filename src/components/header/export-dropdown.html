<!-- Menu & Export Dropdown -->
<div class="dropdown workspace-export-dropdown">
  <button class="btn primary" id="btnExport" title="Actions, Presets &amp; Export Menu">
    <span class="btn-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </span>
    <span class="lbl">Menu</span>
  </button>
  <div class="menu" id="menuExport">
    <div class="menu-label">
      <span class="dot dot-blue"></span>Presentation Mockups
    </div>
    <button class="menu-item" id="optOpenExportModal"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Mockup Image...</span><small>Configure frame, transparent cutout &amp; scale</small></span><span class="mi-pill mi-pill-blue">Custom PNG</span></button>
    <button class="menu-item" id="optExportPNG3x" style="display:none"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Quick Export (3x PNG)</span></span><span class="mi-pill mi-pill-blue">3x PNG</span></button>
    <button class="menu-item" id="optExportTransparent" style="display:none"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Quick Export (Transparent)</span></span><span class="mi-pill mi-pill-cyan">Transparent</span></button>
    <button class="menu-item" id="optExportScreen" style="display:none"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Quick Export (Screen only)</span></span><span class="mi-pill mi-pill-blue">3x PNG</span></button>
    
    <div class="menu-div"></div>
    <div class="menu-label">
      <span class="dot dot-purple"></span>Store Metadata &amp; Backup
    </div>
    <button class="menu-item" id="btnCopyText"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Copy Metadata to Clipboard</span><small>App name, subtitle, descriptions,...</small></span><span class="mi-pill mi-pill-accent">Copy</span></button>
    <button class="menu-item" id="optExportMD"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Metadata (LISTING_METADATA.md)</span><small>Complete store listing document</small></span><span class="mi-pill mi-pill-code">MD</span></button>
    <button class="menu-item" id="optExportJSON"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Export Project File</span><small>Save full backup of text, images &amp; settings</small></span><span class="mi-pill mi-pill-code">JSON</span></button>
    
    <div class="menu-div"></div>
    <div class="menu-label">
      <span class="dot dot-emerald"></span>Project &amp; Import
    </div>
    <button class="menu-item" id="optImportStore"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Import from App Store</span><small>Fetch official metadata, icon &amp; screenshots</small></span><span class="mi-pill mi-pill-blue">Apple</span></button>
    <button class="menu-item" id="optImportJSON"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Import Project File</span><small>Open project from .json file</small></span><span class="mi-pill mi-pill-code">JSON</span></button>

    <div class="menu-div"></div>
    <div class="menu-label">
      <span class="dot dot-amber"></span>Presets &amp; Templates
    </div>
    <button class="menu-item" id="optOpenTemplatesModal" type="button" title="Browse sample demo templates">
      <span class="mi-ico-sparkle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Sample Templates...</span>
        <small>Browse pre-built app listings</small>
      </span>
      <span class="mi-pill mi-pill-open">Browse</span>
    </button>

    <div class="menu-div"></div>
    <div class="menu-label">
      <span class="dot dot-rose"></span>Reset &amp; Clear
    </div>
    <button class="menu-item" id="optResetDefault"><span class="mi-num"></span> <span class="mi-t"><span class="mi-name">Reset to Default Draft</span><small>Clear local draft and reload</small></span><span class="mi-pill mi-pill-danger">Reset</span></button>
  </div>
</div>
<input type="file" id="jsonFileInput" accept=".json" hidden>
