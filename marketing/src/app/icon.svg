<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F211F" />
      <stop offset="100%" stop-color="#121312" />
    </linearGradient>
    <linearGradient id="icon-tablet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008746" />
      <stop offset="100%" stop-color="#004824" />
    </linearGradient>
    <linearGradient id="icon-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34F5A6" />
      <stop offset="100%" stop-color="#00D085" />
    </linearGradient>
    <filter id="icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect width="100" height="100" rx="24" fill="url(#sq-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Interlocking V: Tablet + Phone -->
  <g transform="scale(0.72) translate(19, 19)">
    <!-- Left: Tablet (Deep Forest Emerald) -->
    <g transform="rotate(-23 35 49)">
      <rect x="21" y="15" width="28" height="67" rx="6.5" fill="url(#icon-tablet)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
      <circle cx="35" cy="19.5" r="1.2" fill="rgba(255,255,255,0.4)" />
      <rect x="25" y="24" width="20" height="22" rx="2" fill="rgba(255,255,255,0.12)" />
      <rect x="25" y="49" width="20" height="14" rx="2" fill="rgba(255,255,255,0.12)" />
    </g>

    <!-- Right: Phone (Electric Emerald) - Overlapping with shadow -->
    <g transform="rotate(23 65 49)" filter="url(#icon-shadow)">
      <rect x="55" y="13" width="20" height="71" rx="6" fill="url(#icon-phone)" stroke="rgba(255,255,255,0.38)" stroke-width="1.2" />
      <rect x="61.5" y="16.5" width="7" height="2" rx="1" fill="#00381a" />
      <rect x="58.5" y="22" width="13" height="20" rx="2" fill="rgba(255,255,255,0.25)" />
      <rect x="58.5" y="45" width="13" height="18" rx="2" fill="rgba(255,255,255,0.25)" />
    </g>
  </g>
</svg>
