<!-- 100% Offline Standalone: Native System Font Stack (San Francisco / Segoe UI / Roboto) -->
<script src="lib/html2canvas.min.js"></script>
<script>
try{document.documentElement.dataset.ui = localStorage.getItem("store_preview_studio_ui") || "light";}catch(e){document.documentElement.dataset.ui="light";}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-store="apple" data-ui-store="apple" data-apple-device="iphone" data-google-device="phone" data-dual="false" data-panel="view">

<!-- Header Component -->
<!-- @include "components/header.html" -->

<!-- Workspace Control Bar (Above Form & Canvas) -->
<!-- @include "components/workspace-bar.html" -->

<main>
  <!-- Editor Panel (Left Sidebar) -->
  <section class="editor" id="editorPanel">
    <!-- @include "components/editor.html" -->
  </section>

  <!-- Drag Resizer Splitter -->
  <div class="editor-resizer" id="editorResizer" role="separator" aria-orientation="vertical" title="Drag to resize form panel · Double-click to reset"></div>

  <!-- Stage Area (Right Canvas / Device Mockups) -->
  <section class="stage">
    <!-- Non-destructive Preset Preview Banner -->
    <div class="preset-banner" id="presetBanner" style="display: none;">
      <div class="preset-banner-info">
        <span class="preset-banner-dot"></span>
        <span class="preset-banner-text" id="presetBannerText">
          Viewing preset: <strong id="presetBannerName">TaskFlow</strong> · Your draft is saved safely.
        </span>
      </div>
      <button type="button" class="preset-banner-btn" id="btnReturnToDraft" title="Return to your saved draft">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 14 4 9 9 4"></polyline>
          <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
        </svg>
        <span>Return to My Draft</span>
      </button>
    </div>

    <!-- @include "components/stage-toolbar.html" -->
    <div class="stage-devices" id="stageDevices">
      <!-- @include "components/mockups/apple/iphone.html" -->
      <!-- @include "components/mockups/apple/ipad.html" -->
      <!-- @include "components/mockups/google/phone.html" -->
      <!-- @include "components/mockups/google/tab7.html" -->
      <!-- @include "components/mockups/google/tab10.html" -->
    </div>
    <div class="stage-bottom-bar" id="stageBottomBar">
      <!-- @include "components/stage/view-switcher.html" -->
    </div>
  </section>
</main>

<nav class="mtabs">
  <button data-p="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Edit Listing</button>
  <button data-p="view" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg> Live Preview</button>
</nav>

<!-- @include "components/popover.html" -->

<!-- @include "components/modals/export-modal.html" -->

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
</body>
</html>
