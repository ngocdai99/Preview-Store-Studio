<!-- Editor Activity Bar (Icon Control Strip & Sidebar Toggle) -->
<nav class="activity-bar" id="activityBar" aria-label="Editor Activity Bar">
  <button class="activity-bar-btn sidebar-toggle-btn active" id="btnToggleSidebar" type="button" title="Toggle form panel (Sidebar) [Ctrl+B / ⌘B]" aria-label="Toggle Sidebar" aria-expanded="true">
    <svg class="ico-sidebar-expanded" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3"></rect>
      <path d="M9 3v18"></path>
      <path d="M3 6a3 3 0 0 1 3-3h3v18H6a3 3 0 0 1-3-3V6z" fill="currentColor"></path>
    </svg>
    <svg class="ico-sidebar-collapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3"></rect>
      <path d="M9 3v18"></path>
    </svg>
  </button>
  <div class="activity-bar-divider" aria-hidden="true"></div>
  <div class="activity-bar-items" id="activityBarItems"></div>
</nav>
