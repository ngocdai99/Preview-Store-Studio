<!-- Apple Device Segmented Tabview (Dual / iPhone / iPad) -->
<div class="capsule-seg apple-device-tabview" id="dt" role="tablist" aria-label="Device Selector">
  <span class="vt-pill" aria-hidden="true"></span>
  <button type="button" class="stage-device-tab on" id="btnDualPhone" data-d="dual" role="tab" aria-selected="true" aria-label="Dual Phone Comparison" title="Dual Phone">
    <span class="s-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="8" height="16" rx="2"></rect>
        <rect x="14" y="4" width="8" height="16" rx="2"></rect>
      </svg>
    </span>
    <span class="s-label">Dual</span>
  </button>
  <button type="button" class="stage-device-tab" id="optAppleIphone" data-d="iphone" role="tab" aria-selected="false">
    <span class="s-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="20" rx="3"></rect>
        <line x1="10.5" y1="5" x2="13.5" y2="5"></line>
        <line x1="10" y1="19" x2="14" y2="19"></line>
      </svg>
    </span>
    <span class="s-label">iPhone</span>
  </button>
  <button type="button" class="stage-device-tab" id="optAppleIpad" data-d="ipad" role="tab" aria-selected="false">
    <span class="s-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2.5"></rect>
        <circle cx="12" cy="5" r="0.8" fill="currentColor"></circle>
        <line x1="10" y1="19" x2="14" y2="19"></line>
      </svg>
    </span>
    <span class="s-label">iPad</span>
  </button>
</div>
