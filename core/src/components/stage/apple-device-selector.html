<!-- Apple Device Dropdown (iPhone / iPad) -->
<div class="dropdown stage-device-dropdown" id="dt">
  <button type="button" class="stage-view-btn" id="btnAppleDevice" aria-label="Select Apple device" aria-haspopup="true" aria-expanded="false">
    <span class="stage-view-ico" id="appleDeviceIco" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="20" rx="3"></rect>
        <line x1="10.5" y1="5" x2="13.5" y2="5"></line>
        <line x1="10" y1="19" x2="14" y2="19"></line>
      </svg>
    </span>
    <span class="stage-view-label" id="appleDeviceLabel">iPhone</span>
    <span class="stage-view-arr" aria-hidden="true">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>

  <div class="menu stage-view-menu" id="menuAppleDevice" role="menu">
    <div class="menu-label">
      <span>Apple Device</span>
    </div>

    <!-- iPhone Option -->
    <button type="button" class="menu-item on" id="optAppleIphone" data-d="iphone" role="menuitem">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="3"></rect>
          <line x1="10.5" y1="5" x2="13.5" y2="5"></line>
          <line x1="10" y1="19" x2="14" y2="19"></line>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">iPhone</span>
      </span>
      <span class="mi-check" aria-hidden="true">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
    </button>

    <!-- iPad Option -->
    <button type="button" class="menu-item" id="optAppleIpad" data-d="ipad" role="menuitem">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2.5"></rect>
          <circle cx="12" cy="5" r="0.8" fill="currentColor"></circle>
          <line x1="10" y1="19" x2="14" y2="19"></line>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">iPad</span>
      </span>
      <span class="mi-check" aria-hidden="true">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
    </button>
  </div>
</div>
