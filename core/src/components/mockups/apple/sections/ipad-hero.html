<!-- Apple iPad Hero Header (iOS 18 Authentic) -->
<div class="ipad-head">
  <img class="ipad-ico" data-icon alt="App Icon">
  <div class="ipad-head-info">
    <div class="ipad-name" data-b="name">App Title</div>
    <div class="ipad-sub" data-b="sub">App Subtitle</div>
    <div class="ipad-compat-notice" id="ipadCompatNotice" style="display:none">
      <span>Designed for iPhone</span>
      <span class="ipad-compat-dot" aria-hidden="true">&bull;</span>
      <span>Not verified for iPadOS</span>
    </div>
    <div class="ipad-actions">
      <div>
        <button class="get ipad-get">GET</button>
        <div class="iap ipad-iap" data-iap-apple>In-App Purchases</div>
      </div>
    </div>
  </div>
</div>
