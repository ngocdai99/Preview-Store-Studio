<!-- Reusable iPhone Search Header Component -->
<div class="iphone-header iphone-search-header sr-search-header sr-search-row">
  <div class="sr-search-input">
    <svg class="sr-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="sr-search-query" data-b="name">Search</span>
  </div>
  <button class="iphone-header-btn sr-search-clear" type="button" aria-label="Clear search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
