<!-- Card 1: App Identity -->
<div class="card selected" id="identityCard">
  <div class="card-header">
    <h2><span class="card-num" title="Card 1">1</span><i class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></i><span id="edTitle">App Identity</span></h2>
    <div class="card-header-right">
      <span class="info-tip-btn" data-tip-title="App Identity Guidelines" data-tip-desc="Core identity assets for your store listing: App Icon, App Name, Subtitle, Developer information, Category, and Device Support." data-tip-apple-link="https://developer.apple.com/app-store/product-page/" data-tip-google-link="https://support.google.com/googleplay/android-developer/answer/9866151" tabindex="0" role="button" aria-label="App Identity Guidelines" title="App Identity Guidelines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
      <span class="card-toggle-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
  </div>
  
  <div class="card-body">
  <!-- Icon Picker -->
  <div class="icorow">
    <div class="ico-wrap is-placeholder" id="icoDropZone" title="Click to upload custom app icon" tabindex="0">
      <img id="icoPrev" data-icon alt="App Icon">
      <button type="button" class="ico-remove-btn" id="icoRemove" title="Remove custom app icon" aria-label="Remove custom app icon" style="display:none">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="ico-ov">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
    </div>
    <div class="fg" style="flex:1;min-width:0;margin-bottom:0">
      <div class="lr">
        <div style="display:inline-flex;align-items:center;gap:6px">
          <label id="iconSpecLabel">App Icon (1024×1024 px) <span class="tag a">APPLE</span></label>
          <span class="info-tip-btn" id="iosIconInfoBtn" data-only="apple" tabindex="0" role="button" aria-label="iOS App Icon &amp; Xcode Guidelines" title="iOS App Icon &amp; Xcode Guidelines">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
          <span class="info-tip-btn" data-only="google" data-tip-title="Google Play App Icon Guidelines" data-tip-desc="512 × 512 px 32-bit PNG with alpha channel, up to 1024 KB. Sharp square corners (Google Play dynamically applies 20% corner radius and shadow)." data-tip-google-link="https://support.google.com/googleplay/android-developer/answer/9866151" tabindex="0" role="button" aria-label="Google Play App Icon Guidelines" title="Google Play App Icon Guidelines">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
        <span class="shot-dim-tag" id="iconDimTag" style="display:none"></span>
      </div>
      <p class="hint" id="iconSpecHint" style="font-size:10.5px;margin-bottom:6px">PNG · 1:1 Square · 100% Opaque</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="mini" id="icoUp"><span class="btn-mini-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></span>Upload Icon</button>
        <button type="button" class="mini disabled" id="icoInspect" disabled title="Upload an app icon to inspect store compliance"><span class="btn-mini-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>Inspect</button>
        <input type="file" id="icoFile" accept="image/*" hidden>
      </div>
    </div>
  </div>
  <div id="iconStatusBadge" class="ms-icon-status" style="margin-top:8px;margin-bottom:0;cursor:pointer;display:none" title="Click to inspect icon details"></div>

  <!-- App Name (30 chars) -->
  <div class="fg">
    <div class="lr">
      <label>App name<span class="tag a" title="App Store">APPLE</span><span class="tag g" title="Google Play">GOOGLE</span>
        <span class="info-tip-btn" id="appNameInfoBtn" tabindex="0" role="button" aria-label="App Name Guidelines" title="App Name Guidelines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
      </label>
      <span class="cc" id="c-name"></span>
    </div>
    <input type="text" id="f-name" value="Store Preview Studio" placeholder="e.g. My App Name">
  </div>

  <!-- Subtitle (Apple, 30 chars) -->
  <div class="fg" data-only="apple">
    <div class="lr">
      <label>Subtitle<span class="tag a">APPLE</span>
        <span class="info-tip-btn" data-tip-title="Subtitle Guidelines" data-tip-desc="A concise summary of your app's main purpose (max 30 characters), appearing right below the app name on iOS." data-tip-apple-link="https://developer.apple.com/app-store/product-page/#subtitle" tabindex="0" role="button" aria-label="Subtitle Guidelines" title="Subtitle Guidelines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
      </label>
      <span class="cc" id="c-sub"></span>
    </div>
    <input type="text" id="f-sub" value="Store Mockup Pro" placeholder="e.g. 30-character punchy subtitle">
  </div>

  <!-- Short Description (Google, 80 chars) -->
  <div class="fg" data-only="google">
    <div class="lr">
      <label>Short Description<span class="tag g">GOOGLE</span>
        <span class="info-tip-btn" data-tip-title="Short Description Guidelines" data-tip-desc="The first description users see on Google Play (max 80 characters) before tapping 'About this app'. Crucial for search and conversion." data-tip-google-link="https://support.google.com/googleplay/android-developer/answer/9866151" tabindex="0" role="button" aria-label="Short Description Guidelines" title="Short Description Guidelines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
      </label>
      <span class="cc" id="c-short"></span>
    </div>
    <textarea id="f-short" rows="3" placeholder="e.g. 80-character hook for Google Play Store...">Design, audit & export App Store & Google Play metadata offline.</textarea>
  </div>

  <!-- Developer & Category -->
  <div class="form-row-2col">
    <div class="fg">
      <div class="lr"><label>Developer<span class="tag a" title="App Store">APPLE</span><span class="tag g" title="Google Play">GOOGLE</span></label></div>
      <input type="text" id="f-dev" value="Store Mockup Pro" placeholder="e.g. Company or Studio">
    </div>
    <div class="fg cat-picker-fg">
      <div class="lr">
        <div style="display:inline-flex;align-items:center">
          <label>Category<span class="tag a" title="App Store">APPLE</span><span class="tag g" title="Google Play">GOOGLE</span></label>
          <span class="info-tip-btn" data-tip-title="Category Guidelines" data-tip-desc="The primary category for your app. Helps store algorithms place your app in top charts and recommendation lists." data-tip-apple-link="https://developer.apple.com/app-store/categories/" data-tip-google-link="https://support.google.com/googleplay/android-developer/answer/9859673" tabindex="0" role="button" aria-label="Category Guidelines" title="Category Guidelines">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
      </div>
      <input type="hidden" id="f-cat" value="Developer Tools">
      <!-- Hidden legacy selects for full compatibility -->
      <select class="fsel" id="f-cat-apple" aria-label="App Store primary category" style="display:none"></select>
      <select class="fsel" id="f-cat-google" aria-label="Google Play category" style="display:none"></select>

      <!-- Custom Category Selector -->
      <div class="custom-cat-wrap" id="customCatWrap">
        <button type="button" class="custom-cat-trigger" id="customCatTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="custom-cat-trigger-content">
            <svg class="custom-cat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span class="custom-cat-val" id="customCatVal">Productivity</span>
          </span>
          <svg class="custom-cat-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="custom-cat-menu" id="customCatMenu" role="listbox">
          <div class="custom-cat-search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="customCatSearch" placeholder="Search category..." autocomplete="off" spellcheck="false">
          </div>
          <div class="custom-cat-options" id="customCatOptions"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Supported Devices / App Store Destination (Apple) -->
  <div class="fg" data-only="apple" id="destAppleGroup">
    <div class="lr">
      <label>Supported Devices<span class="tag a">APPLE</span>
        <span class="info-tip-btn" data-tip-title="Supported Devices Guidelines" data-tip-desc="Configure whether your iOS binary is iPhone-only or a Universal app supporting both iPhone and iPad native interfaces." tabindex="0" role="button" aria-label="Supported Devices Guidelines" title="Supported Devices Guidelines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
      </label>
      <span class="dest-badge" id="destStatusBadge">iPhone Only</span>
    </div>

    <div class="dest-grid">
      <!-- iPhone Tile (Primary / Required) -->
      <label class="dest-tile active locked" id="destTileIphone" title="iPhone is required for all iOS App Store listings">
        <input type="checkbox" id="f-dest-iphone" checked disabled class="dest-input">
        <div class="dest-check-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="dest-info">
          <div class="dest-name">iPhone <span class="dest-tag-req">Required</span></div>
        </div>
      </label>

      <!-- iPad Tile (Universal App) -->
      <label class="dest-tile" id="destTileIpad" title="Check to support iPad (Universal App) &amp; enable iPad screenshots">
        <input type="checkbox" id="f-dest-ipad" class="dest-input">
        <div class="dest-check-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="dest-info">
          <div class="dest-name">iPad <span class="dest-tag-opt">Universal</span></div>
        </div>
      </label>
    </div>

    <div class="dest-desc-bar" id="destDescBar">
      <span class="dest-desc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
      <span class="dest-desc-text" id="destIpadHint">
        <strong>iPhone-only Mode:</strong> Apple does not require iPad screenshots. Enable <strong>iPad</strong> if your Xcode target supports iPad.
      </span>
    </div>
  </div>
  </div>
</div>
