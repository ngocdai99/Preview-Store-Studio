<!-- Card Privacy: App Privacy & Data Safety -->
<div class="card collapsed" id="privacyCard">
  <div class="card-header">
    <h2><span class="card-num" title="App Privacy &amp; Data Safety"><span data-only="apple">6</span><span data-only="google">8</span></span><i class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></i>App Privacy &amp; Data Safety</h2>
    <div class="card-header-right">
      <span class="info-tip-btn" id="privacyInfoBtn" tabindex="0" role="button" aria-label="Privacy &amp; Data Safety Guidelines" title="Console Questionnaire Guidelines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
      <span class="card-toggle-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
  </div>
  
  <div class="card-body">
  <div class="pcb-tags" style="margin:2px 0 8px">
    <span class="tag a" title="App Store Nutrition Labels">APPLE</span>
    <span class="tag g" title="Google Play Data Safety">GOOGLE</span>
    <span class="tag mockup" title="Illustrative sample disclosures for preview only">MOCKUP ONLY</span>
  </div>

  <div class="privacy-mode-seg" id="privacyModeSeg" role="radiogroup" aria-label="Privacy Disclosure Profile">
    <button type="button" class="priv-seg-btn active" id="privBtnNone" data-mode="none" aria-checked="true" role="radio">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.5"></circle>
        <polyline points="8.5 12.2 11 14.7 15.5 9.5"></polyline>
      </svg>
      <span>Data Not Collected</span>
    </button>
    <button type="button" class="priv-seg-btn" id="privBtnCollected" data-mode="collected" aria-checked="false" role="radio">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Data Collected</span>
    </button>
  </div>

  <div class="privacy-compact-box" id="privacyMockBanner" role="button" tabindex="0" title="Click to view Privacy section on device">
    <div class="pcb-left">
      <div class="pcb-meta">
        <div class="pcb-title">
          <span id="privacyStatusLabel">Profile: Data Not Collected</span>
        </div>
        <div class="pcb-sub">The developer does not collect any data from this app.</div>
      </div>
    </div>
    <span class="pcb-action">Inspect &rarr;</span>
  </div>

  <!-- Hidden state inputs to maintain 100% backward compatibility for export & presets -->
  <input type="hidden" id="f-priv-linked" value="">
  <input type="hidden" id="f-priv-notlinked" value="">
  <input type="hidden" id="f-priv-google" value="No data shared with third parties, No data collected, Data is encrypted in transit">
  </div>
</div>
