<!-- Card 3: Phone Screenshots Gallery -->
<div class="card collapsed" id="shotsCard">
  <div class="card-header">
    <h2><span class="card-num" title="Card 3">3</span><i class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="17" rx="2.5"></rect><path d="M9 2h9a2 2 0 0 1 2 2v13"></path><circle cx="8" cy="9.5" r="1.2" fill="currentColor" stroke="none"></circle><path d="M4 17l3.5-3.5 2.5 2.5 3-3.5 3 4.5"></path></svg></i>Phone Screenshots</h2>
    <div class="card-header-right">
      <span class="info-tip-btn" data-tip-title="Phone Screenshots Guidelines" data-tip-desc="Visual previews of your app experience. Up to 10 screenshots per display size. The first 3 appear directly in store search results." data-tip-apple-link="https://developer.apple.com/app-store/product-page/#screenshots" data-tip-google-link="https://support.google.com/googleplay/android-developer/answer/9866151#screenshots" tabindex="0" role="button" aria-label="Phone Screenshots Guidelines" title="Phone Screenshots Guidelines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </span>
      <span class="card-toggle-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
  </div>
  <div class="card-body">
  <div id="shotStatusBadge" class="shot-status-badge" style="display:none"></div>
  <p class="hint" id="shotHint" style="margin-bottom:8px;line-height:1.6">
    <strong>Apple App Store:</strong> Upload 1–10 screenshots per display (iPhone 6.9" 1320×2868 / 1290×2796 px or 6.5" 1284×2778 px).<br>
    • PNG or JPEG, no alpha transparency.<br>
    • Drag ⠿ handle to reorder.
  </p>
  <div class="shot-counter-row" style="display:flex;justify-content:flex-end;margin-bottom:8px">
    <span class="cc" id="shotCounter">4 / 8 screenshots</span>
  </div>
  <div class="sl" id="slist"></div>
  <button class="add" id="addShot"><span class="add-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>Add Screenshot</button>
  <input type="file" id="shotFile" accept="image/*" hidden>
  </div>
</div>
