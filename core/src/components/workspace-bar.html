<!-- Workspace Control Bar (Matching Marketing Mini-Studio Presets Row) -->
<nav class="workspace-bar" id="workspaceBar" aria-label="Workspace Controls">
  <div class="workspace-nav-main">
    <!-- Active Draft Button (Exact Marketing Mini-Studio Pill UI) -->
    <button type="button" class="ms-pill custom" id="btnDraft" aria-label="Start your custom app draft">
      <span id="draftBtnTitle">+ Your App</span>
    </button>

    <!-- Guided Tour Button (Route Icon) -->
    <button type="button" class="ms-pill tour-btn" id="btnStartTour" aria-label="Take a 30-second guided tour">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="19" r="3"></circle>
        <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path>
        <circle cx="18" cy="5" r="3"></circle>
      </svg>
      <span>Tour</span>
    </button>
    <script>
      try {
        if (localStorage.getItem('sps_tour_completed') === 'true') {
          var _b = document.getElementById('btnStartTour');
          var _hr = document.querySelector('header .right');
          var _ui = document.getElementById('btnUi');
          if (_b && _hr) {
            if (_ui && _ui.parentNode === _hr) {
              _hr.insertBefore(_b, _ui);
            } else {
              _hr.appendChild(_b);
            }
            _b.classList.add('in-header');
          }
        }
      } catch (_) {}
    </script>

    <!-- Viewing Preset Pill (shown when viewing a preset template) -->
    <button type="button" class="ms-pill custom has-draft on" id="btnPresetPill" aria-label="Currently viewing preset template">
      <img alt="" id="presetBtnThumb" src="">
      <span id="presetBtnTitle">Store Preview Studio</span>
      <small id="presetBtnBadge">Preset</small>
      <span role="button" class="ms-pill-reset-btn" id="presetPillCloseBtn" aria-label="Close preset">&times;</span>
    </button>

    <!-- Export Menu Dropdown -->
    <!-- @include "components/header/export-dropdown.html" -->
  </div>

  <!-- Non-destructive Preset Status Tag (Shown only when edits are made to a preset) -->
  <div class="preset-banner" id="presetBanner" style="display: none;">
    <div class="preset-banner-info">
      <span class="preset-banner-dot"></span>
      <span class="preset-banner-text" id="presetBannerText">
        <strong>Presets only for preview</strong>: edits won't be saved
      </span>
    </div>
    <!-- Suggestion button to copy preset into editable draft when user has no draft -->
    <button type="button" class="preset-banner-btn btn-preset-copy" id="btnCopyPresetToDraft" title="Copy this preset as your custom editable draft">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:2px;">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="btn-lbl-full">Copy this preset as your draft</span>
      <span class="btn-lbl-short">Copy as draft</span>
    </button>
    <!-- Hidden fallback for programmatic trigger & test compatibility -->
    <button type="button" class="preset-banner-btn btn-white" id="btnReturnToDraft" style="display:none;" aria-hidden="true" tabindex="-1" title="Return to your saved draft">
      <span class="btn-lbl-full">Return to My Draft</span>
      <span class="btn-lbl-short">Return</span>
    </button>
  </div>
</nav>
