<!-- Workspace Control Bar (Matching Marketing Mini-Studio Presets Row) -->
<nav class="workspace-bar" id="workspaceBar" aria-label="Workspace Controls">
  <!-- Viewing Preset Pill (shown when viewing a preset template) -->
  <button type="button" class="ms-pill custom has-draft on" id="btnPresetPill" style="display:none;" title="Currently viewing preset template">
    <img alt="" id="presetBtnThumb" src="" style="display:none;">
    <span id="presetBtnTitle">Preset</span>
    <small id="presetBtnBadge">Preset</small>
  </button>

  <!-- Active Draft Button (Exact Marketing Mini-Studio Pill UI) -->
  <button type="button" class="ms-pill custom has-draft on" id="btnDraft" title="Your App (Active Workspace)">
    <img alt="" id="draftBtnThumb" src="" style="display:none;">
    <span id="draftBtnTitle">Your App</span>
    <small id="draftBtnBadge">Draft</small>
  </button>

  <!-- Non-destructive Preset Preview Banner (Moved out of stage canvas to prevent layout shift and device clipping) -->
  <div class="preset-banner" id="presetBanner" style="display: none;">
    <div class="preset-banner-info">
      <span class="preset-banner-dot"></span>
      <span class="preset-banner-text" id="presetBannerText">
        Viewing preset: <strong id="presetBannerName">TaskFlow</strong><span class="preset-banner-sub"> · Your draft is saved safely.</span>
      </span>
    </div>
    <button type="button" class="preset-banner-btn" id="btnReturnToDraft" title="Return to your saved draft">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 14 4 9 9 4"></polyline>
        <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
      </svg>
      <span>Return to My Draft</span>
    </button>
  </div>

  <!-- App Store Clone Button -->
  <button type="button" class="ms-pill ms-pill-import" id="btnOpenStoreImport" title="Clone live app from App Store">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
      <path d="M12 12v9"></path>
      <path d="m8 17 4 4 4-4"></path>
    </svg>
    <span class="lbl-full">Clone Store App</span>
    <span class="lbl-short">Clone</span>
  </button>

  <!-- Export Menu Dropdown -->
  <!-- @include "components/header/export-dropdown.html" -->
</nav>
