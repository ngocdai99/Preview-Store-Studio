<!-- Try Mode Header Brand Replacement: macOS Traffic Lights + Live Demo Pill -->
<div class="brand brand-try-mode" aria-label="Interactive Live Demo">
  <!-- macOS Traffic Lights Row -->
  <div class="mac-traffic-lights" aria-hidden="true">
    <span class="mac-dot mac-dot-close" title="Close"></span>
    <span class="mac-dot mac-dot-minimize" title="Minimize"></span>
    <span class="mac-dot mac-dot-maximize" title="Zoom"></span>
  </div>

  <!-- Live Demo Pill (White Background, Black Text, Font-Weight 500) -->
  <div class="try-live-demo-pill">
    <span class="try-pill-text">Live Demo</span>
  </div>
</div>
