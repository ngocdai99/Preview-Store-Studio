<!-- Menu & Export Dropdown -->
<div class="dropdown workspace-export-dropdown" id="workspaceExportDropdown">
  <button class="btn primary" id="btnExport" title="Actions, Presets &amp; Export Menu">
    <span class="btn-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </span>
    <span class="lbl">Menu</span>
  </button>
  <div class="menu" id="menuExport">
    <!-- Group 1: Deliverables & Export (Images, Text & Backup) -->
    <button class="menu-item" id="optOpenExportModal">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Export Mockup Image...</span>
        <small>Configure frame, transparent cutout &amp; scale</small>
      </span>
      <span class="mi-pill">.png</span>
    </button>
    <button class="menu-item" id="optExportPNG3x" style="display:none"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></span><span class="mi-t"><span class="mi-name">Quick Export (3x PNG)</span></span><span class="mi-pill">.png</span></button>
    <button class="menu-item" id="optExportTransparent" style="display:none"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></span><span class="mi-t"><span class="mi-name">Quick Export (Transparent)</span></span><span class="mi-pill">.png</span></button>
    <button class="menu-item" id="optExportScreen" style="display:none"><span class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></span><span class="mi-t"><span class="mi-name">Quick Export (Screen only)</span></span><span class="mi-pill">.png</span></button>

    <button class="menu-item" id="optExportMD">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Export Metadata (LISTING_METADATA.md)</span>
        <small>Complete store listing document</small>
      </span>
      <span class="mi-pill">.md</span>
    </button>
    <button class="menu-item" id="btnCopyText">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Copy Metadata to Clipboard</span>
        <small>App name, subtitle, descriptions,...</small>
      </span>
    </button>
    <button class="menu-item" id="optExportJSON">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Export Project File</span>
        <small>Save full backup of text, images &amp; settings</small>
      </span>
      <span class="mi-pill">.json</span>
    </button>

    <div class="menu-div"></div>

    <!-- Group 2: Input & Inspiration (Import, Clone & Templates) -->
    <button class="menu-item" id="optImportJSON">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Import Project File</span>
        <small>Open project from .json file</small>
      </span>
      <span class="mi-pill">.json</span>
    </button>
    <button class="menu-item" id="btnOpenStoreImport" type="button" title="Clone live app from App Store">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
          <path d="M12 12v9"></path>
          <path d="m8 17 4 4 4-4"></path>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Clone App from App Store...</span>
        <small>Import live metadata, ratings &amp; screenshots</small>
      </span>
    </button>
    <button class="menu-item" id="optOpenTemplatesModal" type="button" title="Browse sample demo templates">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Sample Templates...</span>
        <small>Browse pre-built app listings</small>
      </span>
    </button>

    <div class="menu-div"></div>

    <!-- Group 3: Danger / Reset -->
    <button class="menu-item" id="optResetAllData" type="button" title="Reset all data">
      <span class="mi-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">Reset</span>
        <small>Clear all data &amp; reload</small>
      </span>
    </button>
  </div>
</div>
<input type="file" id="jsonFileInput" accept=".json,application/json" hidden>
