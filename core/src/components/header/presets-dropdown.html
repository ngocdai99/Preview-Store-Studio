<!-- Presets Dropdown -->
<div class="dropdown">
  <button class="btn" id="btnPresets" title="Choose Template Preset">
    <span class="btn-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    </span>
    <span class="lbl">Presets</span>
    <span class="arr" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>
  <div class="menu" id="menuPresets">
    <button class="menu-item" data-preset="none">
      <span class="preset-thumb-blank" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </span>
      <span class="mi-t">
        <span class="mi-name">None (Blank)</span>
        <small>Clear all fields &amp; start fresh</small>
      </span>
    </button>
    <div class="menu-div"></div>
    <button class="menu-item" data-preset="taskflow">
      <img class="preset-thumb" alt="" aria-hidden="true">
      <span class="mi-t">
        <span class="mi-name">TaskFlow</span>
        <small>SaaS Productivity</small>
      </span>
    </button>
    <button class="menu-item" data-preset="pulsefit">
      <img class="preset-thumb" alt="" aria-hidden="true">
      <span class="mi-t">
        <span class="mi-name">PulseFit</span>
        <small>Fitness &amp; Workout</small>
      </span>
    </button>
    <button class="menu-item" data-preset="zenmind">
      <img class="preset-thumb" alt="" aria-hidden="true">
      <span class="mi-t">
        <span class="mi-name">ZenMind</span>
        <small>Meditation &amp; Sleep</small>
      </span>
    </button>
    <button class="menu-item" data-preset="cyberstrike">
      <img class="preset-thumb" alt="" aria-hidden="true">
      <span class="mi-t">
        <span class="mi-name">CyberStrike</span>
        <small>Sci-Fi Cyber RPG Game</small>
      </span>
    </button>
    <button class="menu-item" data-preset="edulearn">
      <img class="preset-thumb" alt="" aria-hidden="true">
      <span class="mi-t">
        <span class="mi-name">SkillSphere</span>
        <small>Online Video Courses</small>
      </span>
    </button>
  </div>
</div>
