<!-- Store Switcher Segmented Control (Shared Capsule Icon Toggle) -->
<div class="seg capsule-seg" id="storeSwitcher" role="tablist" aria-label="Store Platform">
  <div class="pill" aria-hidden="true"></div>
  <button data-s="apple" class="on" role="tab" aria-selected="true" aria-label="Apple App Store Preview (iPhone &amp; iPad)" title="Apple App Store (iPhone &amp; iPad)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.8L5 19.5M12 3.8l7 15.7M6.5 14.2h11"/>
      </svg>
    </span>
  </button>
  <button data-s="google" role="tab" aria-selected="false" aria-label="Google Play Store Preview (Phone, 7&quot; Tablet, and 10&quot; Tablet)" title="Google Play Store (Phone &amp; Tablet)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 4.2c0-.9 1-1.5 1.8-1l12.4 7.8c.8.5.8 1.6 0 2.1L8.8 20.8c-.8.5-1.8-.1-1.8-1V4.2z"/>
      </svg>
    </span>
  </button>
</div>
