<!-- Store Switcher Segmented Control (Shared Capsule Icon Toggle) -->
<div class="seg capsule-seg" id="storeSwitcher" role="tablist" aria-label="Store Platform">
  <div class="pill" aria-hidden="true"></div>
  <button data-s="apple" class="on" role="tab" aria-selected="true" aria-label="Apple App Store Preview (iPhone &amp; iPad)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
        <path d="M10 2c1 .5 2 2 2 5"/>
      </svg>
    </span>
    <span class="s-label">App Store</span>
  </button>
  <button data-s="google" role="tab" aria-selected="false" aria-label="Google Play Store Preview (Phone, 7&quot; Tablet, and 10&quot; Tablet)">
    <span class="s-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 4.5c0-.8.9-1.3 1.6-.9l12 7.5c.7.4.7 1.4 0 1.8l-12 7.5c-.7.4-1.6-.1-1.6-.9V4.5z"/>

    <span class="s-label">Google Play</span>
  </button>
</div>
