<!-- App Icon Studio: Live Preview & Aspect Ratio Fit Component -->
<div class="icon-resizer-inner-layout" id="iconPaneResize">
  <div class="icon-resizer-canvas-card" id="msIconModalArt">
    <div class="icon-resizer-section-title" id="appIconResizeSectionTitle">Your App Icon</div>
    <div class="icon-resizer-canvas-wrap" id="msIconModalImgWrap">
      <canvas id="appIconResizeLiveCanvas" width="512" height="512" class="icon-resizer-live-canvas"></canvas>
      <img class="icon-modal-img" id="msIconModalImg" style="display: none;" alt="Asset Preview">
    </div>
  </div>

  <!-- Demo Mode Sample Testing Carousel (Slide Scroll UI) -->
  <div class="icon-demo-sample-carousel-wrap" id="iconDemoSampleBar" style="display: none;">
    <div class="icon-demo-sample-header">
      <span class="icon-demo-sample-title">App Icon &amp; Test Assets</span>
    </div>

    <div class="icon-demo-sample-slider" id="iconDemoSampleSlider">
      <!-- Card 1: Current App Icon -->
      <button type="button" class="icon-demo-sample-card active" id="demoSampleCardPreset" data-sample="preset" title="Current App Icon (1:1 Square)">
        <img id="demoSamplePresetThumb" src="" class="icon-demo-card-thumb" alt="Current App Icon">
        <span class="icon-demo-card-tag">1:1</span>
        <div class="icon-demo-card-overlay">
          <span class="icon-demo-card-name">App Icon</span>
          <span class="icon-demo-card-check" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        </div>
      </button>

      <!-- Card 2: Doraemon 1 -->
      <button type="button" class="icon-demo-sample-card" id="demoSampleCard1" data-sample="doraemon1" title="Test 1 (16:9 Landscape)">
        <img src="assets/doraemon1.jpg" class="icon-demo-card-thumb" alt="Test 1" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='/assets/doraemon1.jpg';}">
        <span class="icon-demo-card-tag">16:9</span>
        <div class="icon-demo-card-overlay">
          <span class="icon-demo-card-name">Test 1</span>
          <span class="icon-demo-card-check" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        </div>
      </button>

      <!-- Card 3: Doraemon 2 -->
      <button type="button" class="icon-demo-sample-card" id="demoSampleCard2" data-sample="doraemon2" title="Test 2 (16:9 Landscape)">
        <img src="assets/doraemon2.jpg" class="icon-demo-card-thumb" alt="Test 2" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='/assets/doraemon2.jpg';}">
        <span class="icon-demo-card-tag">16:9</span>
        <div class="icon-demo-card-overlay">
          <span class="icon-demo-card-name">Test 2</span>
          <span class="icon-demo-card-check" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        </div>
      </button>

      <!-- Card 4: Doraemon 3 -->
      <button type="button" class="icon-demo-sample-card" id="demoSampleCard3" data-sample="doraemon3" title="Test 3 (3:4 Portrait)">
        <img src="assets/doraemon3.png" class="icon-demo-card-thumb" alt="Test 3" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='/assets/doraemon3.png';}">
        <span class="icon-demo-card-tag">3:4</span>
        <div class="icon-demo-card-overlay">
          <span class="icon-demo-card-name">Test 3</span>
          <span class="icon-demo-card-check" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        </div>
      </button>
    </div>
  </div>

    <!-- Aspect Ratio Fit Strategy Options -->
    <div class="icon-resizer-fit-container" id="appIconFitContainer">
      <div class="icon-resizer-group-header">
        <span class="icon-resizer-group-label">Aspect Ratio</span>
        <span class="icon-resizer-fit-note" id="appIconFitPassNote" style="display: none;">1:1 square · Ratio changes have no effect</span>
      </div>
      <div class="icon-resizer-fit-options" id="appIconFitOptions">
        <span class="icon-resizer-fit-pill" id="appIconFitPill" aria-hidden="true"></span>
        <label class="icon-resizer-fit-card active" id="appIconFitCardCrop">
          <input type="radio" name="appIconFitMode" value="center-crop" checked>
          <div class="icon-resizer-fit-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </div>
          <div class="icon-resizer-fit-text">
            <div class="icon-resizer-fit-title">Crop</div>
          </div>
        </label>

        <label class="icon-resizer-fit-card" id="appIconFitCardPad">
          <input type="radio" name="appIconFitMode" value="pad">
          <div class="icon-resizer-fit-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <rect x="7" y="7" width="10" height="10"></rect>
            </svg>
          </div>
          <div class="icon-resizer-fit-text">
            <div class="icon-resizer-fit-title">Padding</div>
          </div>
        </label>

        <label class="icon-resizer-fit-card" id="appIconFitCardStretch">
          <input type="radio" name="appIconFitMode" value="stretch">
          <div class="icon-resizer-fit-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </div>
          <div class="icon-resizer-fit-text">
            <div class="icon-resizer-fit-title">Stretch</div>
          </div>
        </label>
      </div>
    </div>

    <!-- Empty view placeholder when aspect ratio is hidden by logic (prevents layout shift) -->
    <div class="icon-resizer-fit-placeholder" id="appIconFitPlaceholder" style="display: none;" aria-hidden="true"></div>
  </div>
