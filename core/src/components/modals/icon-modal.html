<!-- App Icon Studio: Unified Inspector & Resizer Modal Shell -->
<div class="icon-modal-backdrop" id="msIconModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="icon-modal-canvas" id="msIconModalCanvas">
    <!-- Header -->
    <div class="icon-modal-header">
      <div class="icon-modal-header-left">
        <span class="icon-modal-title" id="msIconModalTitle">App Icon Studio</span>
      </div>

      <div class="icon-modal-header-right">
        <div class="icon-modal-hint">
          <span class="icon-modal-hint-drag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Drag & drop image</span>
          </span>
          <span class="icon-modal-hint-esc"><kbd>ESC</kbd> to close</span>
        </div>
        <button type="button" class="icon-modal-close-btn" id="msIconModalClose" aria-label="Close modal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Body Row: [ Left: Canvas Preview & Fit Strategy | Right: Specifications & Diagnostic Log ] -->
    <div class="icon-modal-body">
      <!-- Left Column: Unified Live Canvas Preview & Fit Controls -->
      <div class="icon-modal-stage-panel" id="iconModalPreviewPanel">
        <!-- @include "components/modals/icon/inspector.html" -->
        <!-- @include "components/modals/icon/resizer.html" -->
      </div>

      <!-- Right Column: Log (Source vs Target, Diagnostics, Action Footer) -->
      <!-- @include "components/modals/icon/log.html" -->
    </div>
  </div>
</div>
