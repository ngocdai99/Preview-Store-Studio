<!-- Modern Confirm & Reset Draft Dialog (Synchronized from Marketing) -->
<div class="confirm-modal-backdrop" id="resetConfirmModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-modal-card">
    <div class="confirm-modal-header">
      <div class="confirm-modal-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </div>
      <div class="confirm-modal-meta">
        <h4 class="confirm-modal-title" id="resetConfirmTitle">Reset App Draft?</h4>
        <p class="confirm-modal-desc">This will clear your customized app icon, name, and descriptions. Your current draft cannot be recovered.</p>
      </div>
    </div>
    <div class="confirm-modal-actions">
      <button type="button" class="confirm-btn-cancel" id="resetConfirmCancel">Cancel</button>
      <button type="button" class="confirm-btn-reset" id="resetConfirmOk">Reset</button>
    </div>
  </div>
</div>
