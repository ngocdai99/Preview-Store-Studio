<!-- Modern Confirm & Reset Draft Dialog (Synchronized from Marketing) -->
<div class="confirm-modal-backdrop" id="resetConfirmModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-modal-card">
    <button type="button" class="confirm-modal-close-btn" id="resetConfirmClose" aria-label="Close dialog" title="Close [ESC]">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="confirm-modal-header">
      <div class="confirm-modal-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </div>
      <div class="confirm-modal-meta">
        <h4 class="confirm-modal-title" id="resetConfirmTitle">Reset App Draft?</h4>
        <p class="confirm-modal-desc">This will clear your customized app icon, name, and descriptions. Your current draft cannot be recovered.</p>
      </div>
    </div>
    <div class="confirm-modal-actions">
      <button type="button" class="confirm-btn-backup btn-dark" id="resetConfirmBackup" style="display: none;" title="Export JSON backup without closing dialog">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="confirm-btn-backup-label">Backup JSON</span>
      </button>
      <div class="confirm-modal-actions-right">
        <button type="button" class="confirm-btn-cancel btn-dark" id="resetConfirmCancel">Cancel</button>
        <button type="button" class="confirm-btn-reset btn-white" id="resetConfirmOk">Reset</button>
      </div>
    </div>
  </div>
</div>
